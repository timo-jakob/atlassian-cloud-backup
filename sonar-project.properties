# SonarCloud project configuration for Atlassian Cloud Backup

# Project identification
sonar.projectKey=atlassian-cloud-backup
sonar.organization=timo-jakob-github

# Source code configuration
sonar.sources=src
sonar.tests=tests

# Python-specific settings
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=test-results.xml

# Exclusions for security hotspots in test files
# Tests often use insecure protocols (http) and temporary directories for testing purposes
sonar.security.hotspots.inheritance=NONE
sonar.issue.ignore.multicriteria=e1

# Ignore all security hotspots in test files
sonar.issue.ignore.multicriteria.e1.ruleKey=*
sonar.issue.ignore.multicriteria.e1.resourceKey=tests/**/*

# Additional exclusions for common test patterns
sonar.exclusions=**/__pycache__/**,**/*.pyc

# Coverage exclusions (optional - exclude test files from coverage calculations)
sonar.coverage.exclusions=tests/**/*,**/__pycache__/**,**/*.pyc,**/conftest.py
