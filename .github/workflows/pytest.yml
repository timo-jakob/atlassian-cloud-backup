name: Run Pytest

permissions:
  contents: read
  pull-requests: write  # Needed for SonarCloud to comment on PRs
  checks: write         # Needed for SonarCloud to create checks

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Shallow clones should be disabled for better analysis

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'  # Change as needed

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    - name: Install dependencies
      run: |
        python -m venv venv
        source venv/bin/activate
        pip install --upgrade pip
        pip install -r requirements.txt
        # Install coverage tools for SonarCloud
        pip install pytest-cov coverage
        # Optional: install with extras if needed
        # pip install -e .[dev]

    - name: Run Pytest with coverage
      run: |
        source venv/bin/activate
        # Set PYTHONPATH to ensure proper imports
        export PYTHONPATH="${PYTHONPATH}:$(pwd)/src"
        # Run tests with coverage and generate XML report for SonarCloud with relative paths
        coverage run --source=src/atlassian_cloud_backup -m pytest tests/ --junit-xml=test-results.xml
        coverage xml -o coverage.xml
        coverage report --show-missing

    - name: SonarCloud Scan
      uses: SonarSource/sonarqube-scan-action@5.2.0
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}