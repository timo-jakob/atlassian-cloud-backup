name: Run Pytest

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'  # Change as needed

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    - name: Install dependencies
      run: |
        python -m venv venv
        source venv/bin/activate
        pip install --upgrade pip
        pip install -r requirements.txt
        # Install coverage tools for SonarCloud
        pip install pytest-cov coverage
        # Optional: install with extras if needed
        # pip install -e .[dev]

    - name: Run Pytest with coverage
      run: |
        source venv/bin/activate
        # Run tests with coverage and generate XML report for SonarCloud
        pytest tests/ --cov=src/atlassian_cloud_backup --cov-report=xml:coverage.xml --cov-report=term --junit-xml=test-results.xml

    - name: Upload coverage reports to SonarCloud
      uses: SonarSource/sonarcloud-github-action@master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}